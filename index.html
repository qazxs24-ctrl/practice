<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>練習</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d1029"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="練習"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="fonts.css">
<style>:root{--bg:#0d1029;--p1:#1a2048;--p2:#232b5e;--ln:#3a4590;--ink:#eef0ff;--dim:#9aa3d0;--red:#e8413c;--gold:#ffd43b;--shadow:#05071a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#070a1c;color:var(--ink);font-family:'DotGothic16','PingFang TC','Noto Sans TC','Microsoft JhengHei',monospace;font-size:15px;line-height:1.45}
body{display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;position:sticky;top:0;z-index:5;background:linear-gradient(#0d1029,#0d1029ee)}
.badge{padding:3px 8px;background:var(--red);color:#fff;box-shadow:0 0 0 2px var(--shadow);font-size:13px}
.sp{flex:1}
.gem{display:flex;align-items:center;gap:5px;padding:3px 8px;background:var(--p1);box-shadow:0 0 0 2px var(--ln)}
.gem i,.mg{display:inline-block;width:12px;height:12px;background:radial-gradient(circle at 30% 30%,#fff 0 12%,#7dffd0 13% 50%,#1fb98a 51%);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.ibtn{width:34px;height:34px;background:var(--p1);box-shadow:0 0 0 2px var(--ln);display:grid;place-items:center;font-size:17px}
.view{padding:0 12px 12px}
.px{background:var(--p1);box-shadow:0 0 0 3px var(--shadow),inset 0 0 0 2px var(--ln);padding:12px;margin:12px 0}
.px h3{margin:0 0 8px;font-size:15px;color:var(--gold);font-weight:normal;letter-spacing:1px}
.stage{width:100%;aspect-ratio:16/10;display:block;box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--ln)}
.stagewrap{position:relative;margin:10px 0}
.stagewrap .ov{position:absolute;left:8px;bottom:8px;background:#000a;padding:2px 8px;font-size:13px}
.btn{display:block;width:100%;padding:13px;text-align:center;background:var(--red);color:#fff;font-size:17px;letter-spacing:2px;box-shadow:0 0 0 3px var(--shadow),inset 0 -5px 0 #a82a2a,inset 0 0 0 2px #ff7a74;margin:10px 0}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--p2);box-shadow:0 0 0 3px var(--shadow),inset 0 -5px 0 #161c44,inset 0 0 0 2px var(--ln)}
.btn.gold{background:#d9a60f;color:#2a1c00;box-shadow:0 0 0 3px var(--shadow),inset 0 -5px 0 #a87a00,inset 0 0 0 2px #ffe27a}
.btn.sm{display:inline-block;width:auto;padding:7px 14px;font-size:14px;margin:4px 4px 4px 0;letter-spacing:0}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:22px;color:#fff;font-weight:normal}
.stat span{font-size:12px;color:var(--dim)}
.bar{height:14px;background:#0a0d26;box-shadow:inset 0 0 0 2px #2a3270;position:relative;overflow:hidden}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c,#ffd43b) 0 6px,color-mix(in srgb,var(--c,#ffd43b) 70%,#000) 6px 8px);transition:width .8s steps(12)}
.dim{color:var(--dim);font-size:13px}
.skill{display:block;width:100%;text-align:left;margin:10px 0;padding:12px;background:var(--p1);box-shadow:0 0 0 3px var(--shadow),inset 0 0 0 2px var(--ln)}
.skill.sel{box-shadow:0 0 0 3px var(--gold),inset 0 0 0 2px var(--gold);background:var(--p2)}
.skill .nm{font-size:16px;margin-bottom:6px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:#080b22;box-shadow:0 -3px 0 var(--ln);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav button{padding:8px 0 7px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button canvas{width:26px;height:26px}
.nav button.on{color:var(--gold);background:var(--p1)}
.nav button.mid{position:relative}
.modal{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{width:100%;max-width:420px;max-height:92vh;overflow:auto;background:var(--p1);box-shadow:0 0 0 3px var(--shadow),inset 0 0 0 3px var(--ln),0 0 0 6px var(--ln);padding:16px}
.modal h2{margin:0 0 10px;font-size:18px;font-weight:normal;color:var(--gold)}
input[type=text],textarea{width:100%;background:#0a0d26;color:var(--ink);border:0;box-shadow:inset 0 0 0 2px var(--ln);padding:10px;font:inherit;border-radius:0;outline:none}
textarea{min-height:90px;resize:vertical}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.cat{padding:10px 4px;text-align:center;background:#0a0d26;box-shadow:inset 0 0 0 2px var(--ln);font-size:13px}
.cat b{display:block;font-size:17px;font-weight:normal;margin-bottom:3px}
.cat.on{box-shadow:inset 0 0 0 3px var(--gold);background:var(--p2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:4px 10px;background:#0a0d26;box-shadow:inset 0 0 0 2px var(--ln);font-size:13px}
.chip.on{background:var(--p2);box-shadow:inset 0 0 0 2px currentColor}
.chip.lock{opacity:.45}
.timer{font-size:56px;text-align:center;letter-spacing:3px;margin:6px 0;text-shadow:0 4px 0 #000a}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heat i{aspect-ratio:1;background:#12163a;display:block}
.heat i.l1{background:#2a5a45}.heat i.l2{background:#2f9b6a}.heat i.l3{background:#6fe3a0}.heat i.l4{background:#d6ffe6}
.log{padding:8px 0;border-bottom:2px dashed #2a3270}
.log img{width:72px;height:72px;object-fit:cover;image-rendering:auto;box-shadow:0 0 0 2px var(--ln);margin-top:6px;display:block}
.ms{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.ms.ok{color:var(--gold)}
.ms:not(.ok){color:var(--dim)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000d;padding:9px 16px;z-index:80;box-shadow:0 0 0 2px var(--ln);font-size:14px;max-width:90%;text-align:center}
.bt{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#1a1040 0,#05071a 75%);text-align:center;padding:20px;animation:fadein .3s}
.bt canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bt h1{font-size:44px;margin:0 0 10px;font-weight:normal;letter-spacing:8px;animation:pop .6s steps(6)}
.bt .big{font-size:80px}
.bt .nm{font-size:20px;margin:8px 0}
.bt .lv{font-size:28px;margin:10px 0}
.bt .tap{margin-top:30px;color:var(--dim);animation:blink 1s steps(2) infinite}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes fadein{from{opacity:0}}
@keyframes blink{50%{opacity:0}}
.rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,#ffffff14 0 8deg,transparent 8deg 20deg);animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px 10px;color:var(--dim)}
.photoprev{max-width:100%;max-height:200px;display:block;margin:8px 0}
.fileb{position:relative;overflow:hidden}
.fileb input{position:absolute;inset:0;opacity:0;cursor:pointer}
.warn{color:#ffb3b0}
.runbar{margin:10px 0;padding:10px 12px;background:#3a1220;box-shadow:0 0 0 3px var(--shadow),inset 0 0 0 2px var(--red);cursor:pointer}
.runbar b{font-size:20px;font-weight:normal;color:#fff}
.runbar .blink{color:var(--red);animation:blink 1s steps(2) infinite}
</style></head><body><div id="app"></div><div id="md"></div>
<script>/* ===== 練習 · 純邏輯 (可在 node 測試) ===== */
const RANKS = ['D', 'C', 'B', 'A', 'S', 'SS'];
const RANK_COLORS = ['#eef0f4', '#5fe07a', '#4fa8ff', '#b878ff', '#ffd43b', '#ff4d4d'];
const HOURS_PER_LV = [10, 17, 26, 38, 53, 70];
const CATS = {
  '忍術': { key: 'nin', color: '#ff8a3d', desc: '火遁．雷遁等元素之術' },
  '幻術': { key: 'gen', color: '#c58cff', desc: '幻影．分身．迷惑之術' },
  '體術': { key: 'tai', color: '#6fe3ff', desc: '速度．力量．身體之術' },
};
const NINJA_RANKS = ['入門忍者', '下忍', '中忍', '上忍'];
const MAX_HOURS = 1000;
const DAY_START_HOUR = 5;
const QUALIFY_SEC = 5 * 60;
const QUEST_SEC = 30 * 60;
const QUEST_GEMS = 3;

// 每個 Lv 的起始累積小時 (共30級)
const LEVEL_STARTS = (() => {
  const a = []; let t = 0;
  for (let r = 0; r < 6; r++) for (let l = 0; l < 5; l++) { a.push(t); t += HOURS_PER_LV[r]; }
  return a; // a[29] = 1000 - ... 實際 SS5 起點
})();
// 修正: SS5 起點應為 1000 (最高級)，因此 SS 級每級 70h 共到 1000：720,790,860,930,1000
function levelInfo(hours) {
  const h = Math.min(Math.max(hours, 0), MAX_HOURS);
  let idx = 0;
  for (let i = 0; i < 30; i++) if (h >= LEVEL_STARTS[i]) idx = i;
  const rank = Math.floor(idx / 5), lv = (idx % 5) + 1;
  const isMax = idx === 29;
  const start = LEVEL_STARTS[idx];
  const need = isMax ? 0 : HOURS_PER_LV[rank];
  const into = isMax ? 0 : h - start;
  return { idx, rank, rankName: RANKS[rank], lv, isMax, start, need, into, progress: isMax ? 1 : into / need, color: RANK_COLORS[rank] };
}
function damageBonus(hours) { return 1 + 0.0018 * Math.min(Math.max(hours, 0), MAX_HOURS); }
function ninjaRankIndex(skills) {
  let best = 0;
  for (const s of skills) {
    const r = levelInfo(s.sec / 3600).rank;
    const n = r >= 3 ? 3 : r >= 2 ? 2 : r >= 1 ? 1 : 0;
    if (n > best) best = n;
  }
  return best;
}
function skillTitle(s, withRank) {
  const li = levelInfo(s.sec / 3600);
  return (withRank ? li.rankName + '　' : '') + s.cat + '．' + s.name + '之術（Lv.' + li.lv + '）';
}

// 日期 (凌晨5點換日)
function pad(n) { return String(n).padStart(2, '0'); }
function dayKey(ts) {
  const d = new Date(ts - DAY_START_HOUR * 3600 * 1000);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function keyToDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function addDays(k, n) { const d = keyToDate(k); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function dayTotals(sessions) {
  const m = {};
  for (const s of sessions) {
    const k = dayKey(s.end);
    const o = m[k] || (m[k] = { sec: 0, qualify: false, n: 0 });
    o.sec += s.sec; o.n++;
    if (s.sec >= QUALIFY_SEC) o.qualify = true;
  }
  return m;
}
function computeStats(sessions, now) {
  const m = dayTotals(sessions);
  const keys = Object.keys(m).filter(k => m[k].qualify).sort();
  const today = dayKey(now);
  // 連續天數: 從今天(若今天尚未達成則從昨天)往回
  let streak = 0;
  let k = m[today] && m[today].qualify ? today : addDays(today, -1);
  while (m[k] && m[k].qualify) { streak++; k = addDays(k, -1); }
  // 最長連續
  let best = 0, run = 0, prev = null;
  for (const key of keys) {
    run = prev && addDays(prev, 1) === key ? run + 1 : 1;
    if (run > best) best = run; prev = key;
  }
  const todaySec = m[today] ? m[today].sec : 0;
  const totalSec = sessions.reduce((a, s) => a + s.sec, 0);
  return { streak, best, days: keys.length, todaySec, todayQualified: !!(m[today] && m[today].qualify), totalSec, today, dayMap: m };
}

const STREAK_MS = [[3, 5], [7, 10], [14, 20], [30, 50], [60, 100], [100, 200], [200, 300], [365, 500]];
const HOUR_MS = [[1, 3], [10, 10], [50, 30], [100, 60], [250, 100], [500, 200], [1000, 500]];
const DAYS_MS = [[5, 3], [10, 5], [30, 15], [60, 30], [100, 60], [200, 120], [365, 250]];

// 計算尚未領取的獎勵; 回傳 [{key,gems,label}]
function pendingRewards(state, now) {
  const st = computeStats(state.sessions, now);
  const out = [];
  const claimed = state.claimed || {};
  for (const [d, g] of STREAK_MS) if (st.best >= d && !claimed['streak' + d]) out.push({ key: 'streak' + d, gems: g, label: '連續修練 ' + d + ' 天' });
  const hours = st.totalSec / 3600;
  for (const [h, g] of HOUR_MS) if (hours >= h && !claimed['hour' + h]) out.push({ key: 'hour' + h, gems: g, label: '累積修練 ' + h + ' 小時' });
  for (const [d, g] of DAYS_MS) if (st.days >= d && !claimed['days' + d]) out.push({ key: 'days' + d, gems: g, label: '累積修練 ' + d + ' 天' });
  // 每日任務 (今天達成 30 分鐘)
  const dm = st.dayMap;
  for (const k of Object.keys(dm)) if (dm[k].sec >= QUEST_SEC && !claimed['q:' + k]) out.push({ key: 'q:' + k, gems: QUEST_GEMS, label: '每日任務達成' });
  return out;
}
function applyRewards(state, list) {
  state.claimed = state.claimed || {};
  let g = 0;
  for (const r of list) { state.claimed[r.key] = 1; g += r.gems; }
  state.gems = (state.gems || 0) + g;
  return g;
}
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
}
function fmtHours(sec) { const h = sec / 3600; return h >= 100 ? h.toFixed(0) : h.toFixed(1); }

// 加入修練後的結果摘要 (升級判定)
function addSession(state, skillId, sec, startTs, endTs, note, photoId) {
  const sk = state.skills.find(s => s.id === skillId);
  const before = levelInfo(sk.sec / 3600), nrBefore = ninjaRankIndex(state.skills);
  sk.sec += sec;
  const ses = { id: 's' + endTs.toString(36), skillId, start: startTs, end: endTs, sec, note: note || '', photo: photoId || null };
  state.sessions.push(ses);
  const after = levelInfo(sk.sec / 3600), nrAfter = ninjaRankIndex(state.skills);
  const rewards = pendingRewards(state, endTs);
  const gems = applyRewards(state, rewards);
  return { session: ses, before, after, levelUp: after.idx > before.idx, rankUp: after.rank > before.rank, ninjaUp: nrAfter > nrBefore, ninjaRank: nrAfter, rewards, gems };
}

if (false) module.exports = { RANKS, RANK_COLORS, HOURS_PER_LV, LEVEL_STARTS, levelInfo, damageBonus, ninjaRankIndex, dayKey, addDays, computeStats, pendingRewards, applyRewards, addSession, skillTitle, fmtDur, NINJA_RANKS, CATS };

/* ===== 像素美術 · 舞台 · 特效 · 音效 ===== */
const PAL = { '.': null, n: '#1b2038', N: '#2e3a6e', M: '#3f4f93', s: '#f4cfa6', S: '#d9a77a', r: '#e8413c', R: '#a82a2a', g: '#b9c2da', G: '#7e88a8', w: '#ffffff', b: '#10131f', y: '#ffd43b' };
const NINJA = [
  '....nnnnnnnn....',
  '...nNNNNNNNNn...',
  '...nNNNNNNNNn...',
  '...ngggyygggn...',
  '...nnssssssnn...',
  '...nsbwssbwsn...',
  '...nnnnnnnnnn...',
  '....nnrrrrnnrr..',
  '...nnNMMMNNnrRR.',
  '..nNNMNNNNMNnR..',
  '..nNNNNNNNNNNn..',
  '.snNNNNNNNNNNns.',
  '..nNNggggggNNn..',
  '..nNNNNNNNNNNn..',
  '...nNNNNNNNNn...',
  '...nNNn..nNNn...',
  '...nNNn..nNNn...',
  '..nnNNn..nNNnn..',
  '..nnnnn..nnnnn..',
].map(r => (r + '................').slice(0, 16));
const NINJA_ARMS_UP = [[1, 6, 's'], [14, 6, 's'], [1, 7, 'n'], [14, 7, 'n'], [1, 8, 'N'], [14, 8, 'N'], [1, 9, 'N'], [14, 9, 'N']];

function spriteCanvas(rows, pal, extra) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((row, j) => { for (let i = 0; i < w; i++) { const col = pal[row[i]]; if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } } });
  if (extra) for (const [i, j, k] of extra) { x.clearRect(i, j, 1, 1); x.fillStyle = pal[k]; x.fillRect(i, j, 1, 1); }
  return c;
}
const LOOKPAL = [{}, { r: '#3fbf6a', R: '#27804a' }, { N: '#2f5fa8', M: '#4a82d0', r: '#5bb4ff', R: '#2a6fc0' }, { N: '#5a2f8a', M: '#7a4ab0', r: '#ffd43b', R: '#c9971a', g: '#ffd43b' }];
const LOOKEXTRA = [[], [], [[2, 9, 'g'], [13, 9, 'g']], [[2, 9, 'g'], [13, 9, 'g'], [2, 10, 'g'], [13, 10, 'g'], [14, 12, 'R'], [14, 13, 'R'], [15, 13, 'R'], [14, 14, 'r']]];
const SPRC = {};
function sprites(rank) {
  rank = rank || 0; if (SPRC[rank]) return SPRC[rank];
  const pal = Object.assign({}, PAL, LOOKPAL[rank] || {}), ex = LOOKEXTRA[rank] || [];
  const base = spriteCanvas(NINJA, pal, ex), cast = spriteCanvas(NINJA, pal, ex), x = cast.getContext('2d');
  x.clearRect(1, 11, 1, 1); x.clearRect(14, 11, 1, 1);
  x.fillStyle = pal.s; x.fillRect(1, 5, 2, 2); x.fillRect(13, 5, 2, 2);
  x.fillStyle = pal.n; x.fillRect(2, 7, 1, 4); x.fillRect(13, 7, 1, 4);
  x.fillStyle = pal.N; x.fillRect(3, 8, 1, 3); x.fillRect(12, 8, 1, 3);
  return (SPRC[rank] = { base, cast });
}

function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

const W = 160, H = 100;
let BG = null;
function bgCanvas() {
  if (BG) return BG;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const sky = ['#0b0e2b', '#10143a', '#161a46', '#1d1d52', '#2a2160', '#3a2766', '#512d6b', '#6e3470', '#8a3d6e'];
  for (let i = 0; i < sky.length; i++) { x.fillStyle = sky[i]; x.fillRect(0, i * 8, W, 9); }
  // 月亮
  x.fillStyle = '#c9b8ff22'; for (let r = 18; r > 10; r -= 2) { x.beginPath(); x.arc(122, 22, r, 0, 7); x.fill(); }
  x.fillStyle = '#fff0bd'; x.beginPath(); x.arc(122, 22, 10, 0, 7); x.fill();
  x.fillStyle = '#e8d596'; x.fillRect(118, 18, 3, 3); x.fillRect(124, 25, 4, 3); x.fillRect(121, 28, 2, 2);
  // 遠山
  const mt = (base, amp, col, seed) => {
    x.fillStyle = col;
    for (let i = 0; i < W; i++) {
      const h = base + Math.sin(i * 0.05 + seed) * amp + Math.sin(i * 0.13 + seed * 2) * amp * 0.4;
      x.fillRect(i, Math.round(h), 1, H - h);
    }
  };
  mt(56, 8, '#2a2860', 1); mt(64, 6, '#1d1f4d', 4);
  // 五重塔
  x.fillStyle = '#0d1029';
  const px = 24, pb = 74;
  x.fillRect(px - 1, pb - 38, 2, 6);
  for (let i = 0; i < 4; i++) {
    const wd = 22 - i * 4, y = pb - 8 - i * 9;
    x.fillRect(px - wd / 2 - 3, y, wd + 6, 2);
    x.fillRect(px - wd / 2 - 1, y - 1, wd + 2, 1);
    x.fillRect(px - wd / 2, y + 2, wd, 7);
  }
  x.fillRect(px - 12, pb, 24, 8);

function skillModal(id) {
  const s = skillById(id); if (!s) return;
  const li = levelInfo(s.sec / 3600);
  const bonus = damageBonus(s.sec / 3600);
  let h = '<h2>' + titleHTML(s, true) + '</h2><div class="chips">' + RANKS.map((r, i) => '<span class="chip ' + (i === li.rank ? 'on' : '') + '" style="color:' + RANK_COLORS[i] + '">' + r + '</span>').join('') + '</div>' +
    '<div class="bar" style="--c:' + li.color + '"><i style="width:' + (li.progress * 100) + '%"></i></div><div class="dim" style="margin:6px 0">累積 ' + fmtHours(s.sec) + ' 小時　傷害加成 ' + (bonus * 100).toFixed(0) + '%<br>' + (li.isMax ? '已達最高境界' : '下一級還需 ' + (li.need - li.into).toFixed(1) + ' 小時') + '</div>' +
    '<h3 style="color:var(--gold);font-weight:normal;margin:12px 0 4px">施術特效</h3><canvas id="mst" class="stage" style="margin-bottom:8px"></canvas><div class="chips" id="fxchips"></div><div class="dim">點選已解鎖的特效即可裝備（◆ 為目前裝備），修練畫面會用它攻擊木樁</div>' +
    '<button class="btn alt" data-a="closeModal">關閉</button><button class="btn alt sm" data-a="delSkill" data-v="' + s.id + '" style="color:#ff9b97">刪除技能</button>';
  modal(h);
  const cv = document.getElementById('mst'); skFx = fxTier(s); modalStage = new Stage(cv); modalStage.bonus = damageBonus(s.sec / 3600); modalStage.label = skillLabel(s); modalStage.lcolor = rankColor(s); modalStage.set(s.cat, skFx, true, lookIdx(), true); modalStage.start();
  modalStage.skill = s;
  drawFxChips();
}
function drawFxChips() {
  const s = modalStage.skill, li = levelInfo(s.sec / 3600);
  document.getElementById('fxchips').innerHTML = FXNAMES[s.cat].map((n, i) => '<button class="chip ' + (i <= li.rank ? '' : 'lock') + (i === skFx ? ' on' : '') + '" style="color:' + RANK_COLORS[i] + '" data-a="fx" data-v="' + i + '">' + (i <= li.rank ? '' : '🔒') + (i === fxTier(s) ? '◆' : '') + n + '</button>').join('');
}
function settingsModal() {
  modal('<h2>設定</h2><div class="row" style="margin-bottom:10px"><span>音效</span><span class="sp"></span><button class="btn alt sm" data-a="toggleSound">' + (S.settings.sound ? '開啟' : '關閉') + '</button></div>' +
    '<h3 style="color:var(--gold);font-weight:normal;margin:8px 0">備份</h3><div class="dim" style="margin-bottom:6px">複製下方文字存好，換裝置時貼到「還原」。（照片不含在備份內）</div><textarea id="bk" readonly style="min-height:60px">' + esc(JSON.stringify({ v: 1, skills: S.skills, sessions: S.sessions, gems: S.gems, claimed: S.claimed, settings: S.settings })) + '</textarea><button class="btn alt sm" data-a="copyBackup">複製備份</button>' +
    '<h3 style="color:var(--gold);font-weight:normal;margin:10px 0 6px">還原</h3><textarea id="rs" placeholder="貼上備份文字" style="min-height:60px"></textarea><button class="btn alt sm" data-a="restore">還原資料</button>' +
    testSection() + '<h3 style="color:var(--gold);font-weight:normal;margin:10px 0 6px">重置</h3><button class="btn alt sm" data-a="reset" style="color:#ff9b97">清除所有資料</button><button class="btn" data-a="closeModal">關閉</button>');
}
function testSection() {
  if (!S.skills.length) return '';
  const sim = dayKey(nowTs());
  let h = '<h3 style="color:var(--gold);font-weight:normal;margin:10px 0 6px">測試工具（臨時）</h3><div class="dim" style="margin-bottom:6px">增加時數、模擬修練都會產生標示（模擬）的紀錄（計入今日任務、連續天數、勾玉），可一鍵清除；把時數往下調則直接扣除。</div>';
  h += S.skills.map(k => '<div style="margin:8px 0"><div style="margin-bottom:4px">' + titleHTML(k, true) + '　<span class="dim">' + (k.sec / 3600).toFixed(1) + 'h</span></div><div class="row"><input type="text" inputmode="decimal" id="th_' + k.id + '" placeholder="小時" style="width:80px"><button class="btn alt sm" data-a="thSet" data-v="' + k.id + '">設定</button><button class="btn alt sm" data-a="thAdd" data-v="' + k.id + '|1">+1h</button><button class="btn alt sm" data-a="thAdd" data-v="' + k.id + '|10">+10h</button></div><div class="row"><button class="btn alt sm" data-a="simSes" data-v="' + k.id + '">模擬修練 30 分</button></div></div>').join('');
  h += '<div style="margin:10px 0"><div>模擬日期：' + sim + (S.timeShift ? '（+' + Math.round(S.timeShift / 864e5) + ' 天）' : '（今天）') + '</div><div class="row" style="flex-wrap:wrap"><button class="btn alt sm" data-a="simDay" data-v="1">+1 天</button><button class="btn alt sm" data-a="simDay" data-v="7">+7 天</button><button class="btn alt sm" data-a="simDay" data-v="0">回到今天</button></div>';
  h += '<div class="row" style="margin-top:6px"><input type="text" inputmode="numeric" id="simN" placeholder="天數" style="width:80px"><button class="btn alt sm" data-a="simRun">連續模擬 N 天（每天 30 分）</button></div><div class="dim">連續模擬使用「修練」頁目前選擇的技能；中間想斷掉就先按「+1 天」略過一天。</div><button class="btn alt sm" data-a="simClear" style="color:#ff9b97">清除所有模擬紀錄</button></div>';
  return h;
}
async function setHours(id, hours) {
  const k = skillById(id); if (!k) return;
  hours = Math.max(0, Math.min(MAX_HOURS, hours));
  const target = Math.round(hours * 3600), delta = target - Math.round(k.sec);
  let r = null;
  if (delta > 0) { const end = nowTs(); r = addSession(S, id, delta, end - delta * 1000, end, '（模擬）'); r.session.sim = 1; }
  else { k.sec = target; }
  save(); closeModal(); render();
  if (r && (r.levelUp || r.ninjaUp)) await breakthroughs(r);
  settingsModal();
}
function confirmModal(msg, yesAct, yesLabel, noLabel, v) {
  modal('<h2>確認</h2><div style="margin:8px 0 14px">' + msg + '</div><button class="btn" data-a="' + yesAct + '" data-v="' + (v || '') + '">' + yesLabel + '</button><button class="btn alt" data-a="closeModal">' + (noLabel || '取消') + '</button>');
}

/* ---------- 突破畫面 ---------- */
function showBT(opts) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'bt';
    d.innerHTML = (opts.grand ? '<div class="rays"></div>' : '') + '<canvas class="fx" width="160" height="100"></canvas>' + (opts.big ? '<div class="big" style="color:' + opts.color + '">' + opts.big + '</div>' : '') + '<h1 style="color:' + opts.color + '">' + opts.h + '</h1>' + opts.body + '<div class="tap">輕點繼續</div>';
    document.body.appendChild(d);
    const cv = d.querySelector('canvas.fx'); burstOn(cv, opts.color, opts.grand ? 160 : 70); setTimeout(() => burstOn(cv, opts.color, opts.grand ? 120 : 40), 600);
    if (opts.grand) Sfx.rank(); else Sfx.level();
    let ok = false; setTimeout(() => ok = true, 700);
    d.addEventListener('click', () => { if (!ok) return; d.remove(); res(); });
  });
}
async function breakthroughs(r) {
  const sk = skillById(r.session.skillId);
  if (r.levelUp) {
    const a = r.after, b = r.before;
    if (r.rankUp) await showBT({ grand: 1, color: a.color, big: a.rankName, h: '晉級！', body: '<div class="nm">' + titleHTML(sk, false) + '</div><div class="lv" style="color:' + a.color + '">' + b.rankName + '級 → ' + a.rankName + '級</div><div class="dim">解鎖特效「' + FXNAMES[sk.cat][a.rank] + '」</div>' });
    else await showBT({ color: a.color, h: '突破！', body: '<div class="nm">' + titleHTML(sk, false) + '</div><div class="lv">Lv.' + b.lv + ' → Lv.' + a.lv + '</div>' });
  }
  if (r.ninjaUp) await showBT({ grand: 1, color: '#ffd43b', big: NINJA_RANKS[r.ninjaRank], h: '晉升！', body: '<div class="nm">你成為了 ' + NINJA_RANKS[r.ninjaRank] + '</div>' });
  if (r.gems) Sfx.gem();
}

/* ---------- 動作 ---------- */
const A = {
  tab(v) { if (v === 'dungeon') { modal('<h2>關卡</h2><div style="margin:10px 0 16px;font-size:17px;text-align:center">關卡功能開發中</div><button class="btn alt" data-a="closeModal">好</button>'); return; } tab = v; lastResult = null; render(); window.scrollTo(0, 0); },
  go(v) { tab = v; render(); window.scrollTo(0, 0); },
  gal(v) { const [k, x] = v.split(':'); if (k === 'look') galLook = +x; else if (k === 'cat') galCat = x; else galTier = +x; render(); },
  backHome() { tab = 'home'; lastResult = null; render(); window.scrollTo(0, 0); },
  addSkill() { addSkillModal(); },
  pickCat(v) { newCat = v; document.querySelectorAll('.cat').forEach(e => e.classList.toggle('on', e.dataset.v === v)); },
  createSkill() {
    let n = (document.getElementById('sn').value || '').trim().replace(/\s+/g, '').replace(/之術$/, '');
    if (!n) { toast('請輸入技能名稱'); return; }
    if (S.skills.some(s => s.name === n && s.cat === newCat)) { toast('已有同名技能'); return; }
    S.skills.push({ id: 'k' + Date.now().toString(36), name: n, cat: newCat, sec: 0, created: Date.now() });
    save(); closeModal(); if (tab === 'home' || tab === 'train') { selId = S.skills[S.skills.length - 1].id; } render(); toast('新增了 ' + newCat + '．' + n + '之術');
  },
  openSkill(v) { skillModal(v); },
  fx(v) { const i = +v, s = modalStage.skill, li = levelInfo(s.sec / 3600); if (i > li.rank) { toast('達到 ' + RANKS[i] + ' 級解鎖'); return; } skFx = i; s.fx = i; save(); modalStage.set(s.cat, i, true, lookIdx(), true); drawFxChips(); toast('已裝備「' + FXNAMES[s.cat][i] + '」'); },
  delSkill(v) { confirmModal('刪除這個技能？已累積的時數會一併消失，修練歷程保留。', 'delSkillYes', '確定刪除', '取消', v); },
  delSkillYes(v) { S.skills = S.skills.filter(s => s.id !== v); save(); closeModal(); render(); },
  closeModal() { closeModal(); },
  selSkill(v) { selId = v; render(); },
  startTrain() { Sfx.init(); Sfx.start(); S.active = { skillId: selId, start: Date.now() }; tab = 'train'; save(); render(); },
  finish() {
    const sec = Math.floor((Date.now() - S.active.start) / 1000);
    if (sec < 60) { modal('<h2>時間太短</h2><div style="margin:8px 0 14px">修練不滿 1 分鐘，不會被記錄。</div><button class="btn" data-a="closeModal">繼續修練</button><button class="btn alt" data-a="giveupYes">放棄這次</button>'); return; }
    S.pending = { skillId: S.active.skillId, start: S.active.start, end: nowTs(), sec }; S.active = null; pendingPhoto = null; save(); render();
  },
  giveup() { confirmModal('放棄這次修練？時間不會被記錄。', 'giveupYes', '放棄', '繼續修練'); },
  giveupYes() { S.active = null; save(); closeModal(); tab = 'train'; render(); },
  savePending() {
    const p = S.pending; if (!p) return;
    const note = (document.getElementById('note') || {}).value || '';
    let pid = null; if (pendingPhoto) { pid = 'p' + p.end.toString(36); savePhoto(pid, pendingPhoto); }
    const r = addSession(S, p.skillId, p.sec, p.start, p.end, note.trim(), pid);
    S.pending = null; pendingPhoto = null; lastResult = r; save(); render();
    setTimeout(() => { const b = document.getElementById('rbar'); if (b) b.style.width = (r.after.progress * 100) + '%'; }, 100);
    breakthroughs(r);
  },
  settings() { settingsModal(); },
  simDay(v) { S.timeShift = +v === 0 ? 0 : (S.timeShift || 0) + (+v) * 864e5; save(); render(); settingsModal(); },
  async simSes(v) {
    const k = skillById(v); if (!k) return; const nb = ninjaRankIndex(S.skills), b = levelInfo(k.sec / 3600), end = nowTs();
    const r = addSession(S, v, 1800, end - 1800e3, end, '（模擬）'); r.session.sim = 1; save(); render();
    await breakthroughs(r); settingsModal();
  },
  async simRun() {
    const n = Math.max(1, Math.min(120, parseInt(document.getElementById('simN').value, 10) || 0)); if (!n) { toast('請輸入天數'); return; }
    const id = (selId && skillById(selId)) ? selId : S.skills[0].id, k = skillById(id), b = levelInfo(k.sec / 3600), nb = ninjaRankIndex(S.skills); let g = 0;
    for (let i = 0; i < n; i++) { const end = nowTs(), r = addSession(S, id, 1800, end - 1800e3, end, '（模擬）'); r.session.sim = 1; g += r.gems; if (i < n - 1) S.timeShift = (S.timeShift || 0) + 864e5; }
    save(); render(); const a = levelInfo(k.sec / 3600), na = ninjaRankIndex(S.skills);
    toast('已模擬 ' + n + ' 天，勾玉 +' + g);
    if (a.idx > b.idx || na > nb) await breakthroughs({ session: { skillId: id }, before: b, after: a, levelUp: a.idx > b.idx, rankUp: a.rank > b.rank, ninjaUp: na > nb, ninjaRank: na, gems: 0 });
    settingsModal();
  },
  simClear() {
    for (const x of S.sessions.filter(x => x.sim)) { const k = skillById(x.skillId); if (k) k.sec = Math.max(0, k.sec - x.sec); }
    S.sessions = S.sessions.filter(x => !x.sim); S.timeShift = 0;
    const all = pendingRewards({ sessions: S.sessions, claimed: {} }, nowTs()), keep = {}; let g = 0;
    for (const r of all) { keep[r.key] = 1; g += r.gems; }
    S.claimed = keep; S.gems = g; save(); render(); settingsModal(); toast('已清除模擬紀錄');
  },
  thSet(v) { const h = parseFloat((document.getElementById('th_' + v).value || '').trim()); if (isNaN(h)) { toast('請輸入小時數'); return; } setHours(v, h); },
  thAdd(v) { const [id, n] = v.split('|'), k = skillById(id); setHours(id, k.sec / 3600 + (+n)); },
  toggleSound() { S.settings.sound = !S.settings.sound; Sfx.on = S.settings.sound; save(); settingsModal(); },
  copyBackup() { const t = document.getElementById('bk'); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { } if (!ok && navigator.clipboard) { navigator.clipboard.writeText(t.value).then(() => toast('已複製'), () => toast('請手動選取複製')); return; } toast(ok ? '已複製' : '請手動選取複製'); },
  restore() {
    try {
      const o = JSON.parse(document.getElementById('rs').value.trim());
      if (!o || !Array.isArray(o.skills) || !Array.isArray(o.sessions)) throw 0;
      S = Object.assign(defaultState(), o, { active: null, pending: null }); save(); closeModal(); tab = 'home'; render(); toast('已還原');
    } catch (e) { toast('備份格式不正確'); }
  },
  reset() { confirmModal('清除所有技能與紀錄？此動作無法復原。', 'resetYes', '清除', '取消'); },
  resetYes() { S = defaultState(); selId = null; save(); closeModal(); tab = 'home'; render(); },
  bigPhoto(v) { const u = getPhoto(v); if (u) modal('<img src="' + u + '" style="width:100%;display:block"><button class="btn alt" data-a="closeModal">關閉</button>'); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  Sfx.init(); if (t.dataset.a !== 'startTrain') Sfx.tap();
  const f = A[t.dataset.a]; if (f) f(t.dataset.v, t, e);
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'ph' || !e.target.files[0]) return;
  try { pendingPhoto = await resizePhoto(e.target.files[0]); document.getElementById('phbox').innerHTML = '<img class="photoprev" src="' + pendingPhoto + '">'; } catch (er) { toast('照片讀取失敗'); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

load(); Sfx.on = S.settings.sound !== false;
render();
document.querySelectorAll('img[data-pid]').forEach(i => { if (!i.getAttribute('src')) fetchPhoto(i.dataset.pid, i); });
initDb();

</script><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});}</script></body></html>
